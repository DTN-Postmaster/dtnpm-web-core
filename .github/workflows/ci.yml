# Expects sibling checkouts of dtnpm-core (`../dtnpm-core`) and hardy (`../../hardy`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Web Core Rust Tests & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dtn-postmaster/dtnpm-web-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-web-core
      - name: Formatting check
        working-directory: dtn-postmaster/dtnpm-web-core
        run: cargo fmt --all -- --check
      - name: Strict Clippy check (production targets)
        working-directory: dtn-postmaster/dtnpm-web-core
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::panic
      - name: Run cargo test
        working-directory: dtn-postmaster/dtnpm-web-core
        run: cargo test --all-features
      - name: Generate CycloneDX / SPDX SBOM (Syft)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: dtn-postmaster/dtnpm-web-core
          output-file: dtn-postmaster/dtnpm-web-core/sbom.json
          format: cyclonedx-json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core/sbom.json

  security-audit:
    name: Security & License Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dtn-postmaster/dtnpm-web-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-web-core
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tool: cargo-audit, cargo-deny
      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gitleaks
          key: gitleaks-8.30.1-linux-x64
      - name: Install gitleaks (cache miss)
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/gitleaks"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/gitleaks" gitleaks
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/gitleaks" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install UI dependencies (for audit)
        working-directory: dtn-postmaster/dtnpm-web-core/ui
        run: pnpm install --frozen-lockfile
      - name: Run strict security checks
        working-directory: dtn-postmaster/dtnpm-web-core
        run: ./scripts/check-security.sh --strict

  code-coverage:
    name: Code Coverage (LCOV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout dtnpm-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dtn-postmaster/dtnpm-web-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm-web-core
      - uses: taiki-e/install-action@9299c56f1fb893650f348425bb02c3acf492ebd2 # cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate LCOV coverage report
        working-directory: dtn-postmaster/dtnpm-web-core
        run: ./scripts/check-coverage.sh --lcov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core/lcov.info
