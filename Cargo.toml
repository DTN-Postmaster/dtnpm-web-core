[package]
name = "dtnpm-web-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtn-postmaster/dtnpm-web-core"
description = "Core Axum WebUI server, WebModule plugin trait, capabilities discovery, system API routes, and Preact shell for dtn-postmaster"

[dependencies]
dtnpm-core = { version = "0.2", path = "../dtnpm-core" }
hardy-async = { version = "0.2", path = "../../hardy/async" }
hardy-bpa = { version = "0.2", path = "../../hardy/bpa", default-features = false, features = ["serde", "rfc9173", "tokio"] }
hardy-bpv7 = { version = "0.6", path = "../../hardy/bpv7", features = ["std", "serde", "rfc9173"] }
hardy-eid-patterns = { version = "0.4", path = "../../hardy/eid-patterns", features = ["serde", "dtn-pat-item"] }

anyhow = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["array", "bundled", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
